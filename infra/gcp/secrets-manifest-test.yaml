# Secret Manager Resource Declarations for Google Cloud TEST Deployment
# Project: leave-tracker-2025 (us-central1)
# NOTE: Secrets must be populated with cryptographically random strings prior to deployment.

secrets:
  - name: analytics-test-jwt-secret
    description: "HS256 secret for signing and verifying test dashboard administrative JWT access tokens."
    min_length_chars: 64

  - name: analytics-test-db-app-password
    description: "Database credentials for the unprivileged runtime role 'analytics_app' in test environment."
    min_length_chars: 32

  - name: analytics-test-db-admin-password
    description: "Database credentials for migration and DDL role 'analytics_admin' in test environment."
    min_length_chars: 32
