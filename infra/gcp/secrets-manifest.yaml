# Google Cloud Secret Manager Manifest for Analytics Platform (Unified Model)
# Project: leave-tracker-2025
# Minimizes active secret count to stay within Google Cloud Secret Manager Free Tier (<= 6 active secret versions).
# Note: Google Cloud Firestore uses IAM service account authentication, requiring NO database password secret.

secrets:
  - name: analytics-jwt-secret
    description: "Cryptographically random HS256 secret key for signing administrative access tokens."
    replication:
      automatic: {}
    labels:
      service: analytics-platform
      environment: production
